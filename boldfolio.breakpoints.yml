boldfolio.mobile:
  label: mobile
  mediaQuery: 'all and (max-width: 799px)'
  weight: 0
  multipliers:
    - 1x
    - 2x
boldfolio.medium:
  label: desktop
  mediaQuery: 'all and (min-width: 800px) and (max-width: 1199px)'
  weight: 1
  multipliers:
    - 1x
    - 2x
boldfolio.large:
  label: large desktop
  mediaQuery: 'all and (min-width: 1200px)'
  weight: 2
  multipliers:
    - 1x
    - 2x
